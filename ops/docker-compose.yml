version: "3.9"

services:
  veritas-backend:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - veritas-data:/data
    environment:
      - VERITAS_DB_PATH=/data/veritas.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  veritas-data:
